    <script type="text/babel" data-presets="react">
const { useState, useRef, useEffect } = React;

const GOLF_API_KEY = "PKKKM6QRKV6ED2ZKNULS43NRG4";

// ── THEME — black & white with green accent ──────────────────────────────────
const T = {
  teal:"#2D7A3A",     // forest green accent
  tealDark:"#1F5C2A",
  tealPale:"#E8F5E9",
  gold:"#F9A825",
  red:"#D32F2F",
  blue:"#1565C0",
  green:"#2D7A3A",
  bg:"#F5F5F5",
  white:"#FFFFFF",
  border:"#E0E0E0",
  text:"#111111",
  sub:"#555555",
  dim:"#999999",
  // Dark UI
  dark:"#1C2331",     // navy black for header/nav
  darkCard:"#252D3D",
  darkBorder:"rgba(255,255,255,0.1)",
};
const TC = { red:{bg:"#E53935",label:"Red"}, blue:{bg:"#1E88E5",label:"Blue"}, green:{bg:"#43A047",label:"Green"}, yellow:{bg:"#F9A825",label:"Gold"} };
const DP = [5,4,5,4,3,5,3,4,4,3,4,5,4,4,5,3,4,4];
const DS = [9,15,7,1,13,5,17,3,11,10,6,18,2,16,4,8,14,12];
const DY = [520,385,470,390,175,510,145,395,410,155,375,490,365,355,490,160,380,405];
const BUILTIN = [{id:"tewkesbury",name:"Tewkesbury Park",location:"Tewkesbury, Gloucestershire",pars:DP,sis:DS,yards:DY,lat:51.987,lon:-2.162}];

// ── UTILS ─────────────────────────────────────────────────────────────────────
const uid  = () => Date.now().toString(36) + Math.random().toString(36).slice(2,5);
const gcode= () => Math.random().toString(36).slice(2,8).toUpperCase();
const tm   = t  => TC[t] || TC.red;
const n    = v  => Number(v) || 0;

function sf(score, par, hcp, si) {
  if (!score || score <= 0) return 0;
  const shots = Math.floor(hcp / 18) + (si <= (hcp % 18) ? 1 : 0);
  return Math.max(0, par - (score - shots) + 2);
}
function totalSF(scores, hcp, pars, sis) {
  return (scores || []).reduce((acc, v, i) => v > 0 ? acc + sf(v, pars[i], hcp, sis[i]) : acc, 0);
}
function yds(la1,lo1,la2,lo2) {
  const R=6371000, dLa=(la2-la1)*Math.PI/180, dLo=(lo2-lo1)*Math.PI/180;
  const a = Math.sin(dLa/2)**2 + Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dLo/2)**2;
  return Math.round(2*R*Math.asin(Math.sqrt(a))*1.09361);
}
// Safe score getter
function getScores(game, pid, day) {
  if (!game || !game.scores) return Array(18).fill(0);
  const byDay = game.scores[pid];
  if (!byDay) return Array(18).fill(0);
  const arr = byDay[day];
  if (!arr || !Array.isArray(arr)) return Array(18).fill(0);
  return [...arr];
}

// ── ATOMS ─────────────────────────────────────────────────────────────────────
const Ico = ({d,sz=20,col="currentColor"}) => (
  <svg width={sz} height={sz} viewBox="0 0 24 24" fill="none" stroke={col} strokeWidth={2} strokeLinecap="round" strokeLinejoin="round"><path d={d}/></svg>
);

function Av({name, team, size=38}) {
  const ini = name.split(" ").map(x=>x[0]).join("").slice(0,2).toUpperCase();
  return <div style={{width:size,height:size,borderRadius:"50%",background:tm(team).bg,color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:size*0.34,flexShrink:0}}>{ini}</div>;
}

function Chip({pts}) {
  const bg = pts>=4?"#1A237E":pts===3?"#1565C0":pts===2?"#42A5F5":pts===1?"#90CAF9":"#E0E6E3";
  const col = pts>=3?"#fff":pts>=1?T.text:T.dim;
  return <div style={{width:28,height:28,borderRadius:6,background:bg,color:col,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:12}}>{pts>0?pts:"—"}</div>;
}
// Score block — coloured by Stableford points earned
function ScoreBlock({score, par, hcp, si}) {
  if(!score||score<=0) return <div style={{width:28,height:28,borderRadius:6,background:"#EEEEEE",color:"#bbb",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12}}>—</div>;
  const pts = sf(score,par,hcp,si);
  let bg="#EEEEEE", col="#999";
  if(pts>=4){bg="#1A237E";col="#fff";}      // eagle or better (4+ pts)
  else if(pts===3){bg="#1565C0";col="#fff";} // birdie (3 pts)
  else if(pts===2){bg="#42A5F5";col="#fff";} // par (2 pts)
  else if(pts===1){bg="#90CAF9";col="#333";} // bogey (1 pt)
  // pts===0 stays grey — double bogey or worse = no score
  return <div style={{width:28,height:28,borderRadius:6,background:bg,color:col,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:12}}>{score}</div>;
}

function Bar({title,sub,onBack,right}) {
  return (
    <div style={{background:T.dark,padding:"12px 16px",display:"flex",alignItems:"center",gap:10,flexShrink:0}}>
      {onBack && <button onClick={onBack} style={{background:"none",border:"none",color:"#fff",cursor:"pointer",padding:0,display:"flex"}}><Ico d="M19 12H5M12 5l-7 7 7 7" sz={22} col="#fff"/></button>}
      <div style={{flex:1}}>
        <div style={{fontWeight:700,fontSize:17,color:"#fff"}}>{title}</div>
        {sub && <div style={{fontSize:11,color:"rgba(255,255,255,0.6)",marginTop:1}}>{sub}</div>}
      </div>
      {right}
    </div>
  );
}

function Crd({children, style={}}) {
  return <div style={{background:T.white,borderRadius:14,padding:16,boxShadow:"0 1px 4px rgba(0,0,0,0.06)",border:`1px solid ${T.border}`,...style}}>{children}</div>;
}

function Btn({label,onClick,disabled,full,sm,outline,color}) {
  const bg = disabled?"#E8E8E8":outline?"transparent":(color||T.teal);
  const cl = disabled?T.dim:outline?(color||T.teal):"#fff";
  return (
    <button onClick={onClick} disabled={disabled}
      style={{background:bg,color:cl,border:outline?`2px solid ${color||T.teal}`:"none",borderRadius:10,
        padding:sm?"8px 14px":"13px 18px",fontWeight:700,fontSize:sm?13:15,
        cursor:disabled?"not-allowed":"pointer",width:full?"100%":"auto",opacity:disabled?0.6:1}}>
      {label}
    </button>
  );
}

function Fld({children}) {
  return <div style={{fontSize:11,fontWeight:600,color:T.sub,letterSpacing:0.5,marginBottom:5,marginTop:12}}>{children}</div>;
}

function Inp({label,value,onChange,placeholder,type="text"}) {
  return (
    <div>
      {label && <Fld>{label}</Fld>}
      <input type={type} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder}
        style={{width:"100%",padding:"11px 13px",background:"#F8FAFA",border:`1px solid ${T.border}`,borderRadius:10,fontSize:14,color:T.text,boxSizing:"border-box"}}/>
    </div>
  );
}

// ── NAV ───────────────────────────────────────────────────────────────────────
const TABS = [
  {id:"setup",   label:"Setup",      icon:"M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"},
  {id:"cards",   label:"Scorecard",  icon:"M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2"},

function Nav({tab, setTab}) {

            <Ico d={t.icon} sz={19} col={active?"#fff":"rgba(255,255,255,0.35)"}/>
            <span style={{fontSize:8.5,fontWeight:active?700:400,color:active?"#fff":"rgba(255,255,255,0.35)",letterSpacing:0.2}}>{t.label}</span>

// ═══════════════════════════════════════════════════════════════════════════════
// COURSES TAB
// ═══════════════════════════════════════════════════════════════════════════════
function CoursesTab({course, setCourse, setTab}) {
  const [nearby,  setNearby]  = useState([]);
  const [query,   setQuery]   = useState("");
  const [results, setResults] = useState([]);
  const [loading, setLoading] = useState(false);
  const [locLoad, setLocLoad] = useState(false);
  const [err,     setErr]     = useState("");
  const [view,    setView]    = useState("home"); // home | search

  // Load nearby courses on mount using GPS
  useEffect(() => {
    setLocLoad(true);
    if (!navigator.geolocation) { setLocLoad(false); return; }
    navigator.geolocation.getCurrentPosition(
      async pos => {
        try {
          const { latitude: lat, longitude: lon } = pos.coords;
          const r = await fetch(`/api/search?lat=${lat}&lon=${lon}`);
          if (!r.ok) throw new Error();
          const data = await r.json();
          setNearby(data.courses || []);
        } catch {
          setNearby(BUILTIN);
        }
        setLocLoad(false);
      },
      () => { setNearby(BUILTIN); setLocLoad(false); },
      { timeout: 8000 }
    );
  }, []);

  async function search() {
    if (!query.trim()) return;
    setLoading(true); setErr(""); setResults([]);
    const bi = BUILTIN.filter(c => c.name.toLowerCase().includes(query.toLowerCase()));
    try {
      const r = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
      if (!r.ok) throw new Error();
      const data = await r.json();
      setResults([...bi, ...(data.courses || [])]);
      if (!bi.length && !(data.courses || []).length) setErr("No courses found");
    } catch {
      setResults(BUILTIN);
      setErr("Showing built-in courses.");
    }
    setLoading(false);
  }

  async function pick(c) {
    if (c.pars) { setCourse(c); setTab("map"); return; }
    let full = c;
    try {
      const r = await fetch(`/api/search?id=${c.id}`);
      if (r.ok) full = await r.json();
    } catch {}
    const course_data = full.course || full;
    const tee   = course_data.tees?.male?.[0] || course_data.tees?.female?.[0] || {};
    const holes = tee.holes || [];
    setCourse({
      id:       c.id,
      name:     c.club_name || c.course_name || c.name,
      location: [c.location?.city, c.location?.state_name, c.location?.country].filter(Boolean).join(", "),
      pars:     holes.length === 18 ? holes.map(h => h.par      || 4) : DP,
      sis:      holes.length === 18 ? holes.map(h => h.handicap || 0) : DS,
      yards:    holes.length === 18 ? holes.map(h => h.yardage  || 0) : DY,
      lat:      c.location?.latitude,
      lon:      c.location?.longitude,
      holeCoords: holes.map(h => ({
        greenLat: h.green?.lat || null,
        greenLon: h.green?.lon || null,
        teeLat:   h.tee?.lat   || null,
        teeLon:   h.tee?.lon   || null,
      })),
    });
    setTab("map");
  }

  // Generate satellite thumbnail URL for a course
  function thumbUrl(lat, lon) {
    if (!lat || !lon) return null;
    // Esri static map - free, no key needed
    return `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/export?bbox=${lon-0.008},${lat-0.006},${lon+0.008},${lat+0.006}&bboxSR=4326&size=400,200&imageSR=4326&format=jpg&f=image`;
  }

  function CourseCard({c, onPick}) {
    const name = c.name || c.club_name || c.course_name || "";
    const loc  = c.location
      ? [c.location.city, c.location.state_name, c.location.country].filter(Boolean).join(", ")
      : (c.location_string || "");
    const lat  = c.location?.latitude  || c.lat;
    const lon  = c.location?.longitude || c.lon;
    const par  = c.pars ? c.pars.reduce((a,b)=>a+b,0) : c.tees?.male?.[0]?.par_total;
    const thumb = thumbUrl(lat, lon);
    const active = course && (course.id === c.id || course.name === name);

    return (
      <div onClick={() => onPick(c)}
        style={{background:T.white, borderRadius:14, overflow:"hidden",
          border:`2px solid ${active ? T.teal : T.border}`,
          boxShadow:"0 2px 8px rgba(0,0,0,0.07)", cursor:"pointer", marginBottom:12}}>
        {/* Satellite thumbnail */}
        <div style={{height:140, background:"#1a2c25", position:"relative", overflow:"hidden"}}>
          {thumb
            ? <img src={thumb} alt={name}
                style={{width:"100%", height:"100%", objectFit:"cover"}}
                onError={e => { e.target.style.display="none"; }}/>
            : <div style={{width:"100%", height:"100%", display:"flex", alignItems:"center",
                justifyContent:"center", fontSize:32}}>⛳</div>}
          {active && (
            <div style={{position:"absolute", top:10, right:10,
              background:T.teal, color:"#fff", borderRadius:20,
              padding:"3px 10px", fontSize:11, fontWeight:700}}>
              ✓ Selected
            </div>
          )}
          {par && (
            <div style={{position:"absolute", bottom:10, left:10,
              background:"rgba(0,0,0,0.7)", color:"#fff", borderRadius:20,
              padding:"3px 10px", fontSize:11, fontWeight:700}}>
              Par {par}
            </div>
          )}
        </div>
        <div style={{padding:"10px 14px 12px"}}>
          <div style={{fontWeight:700, fontSize:15, color:T.text}}>{name}</div>
          {loc && <div style={{fontSize:12, color:T.sub, marginTop:2}}>{loc}</div>}
        </div>
      </div>
    );
  }

  const list = view === "search" ? results : (nearby.length ? nearby : BUILTIN);

  return (
    <div style={{flex:1, display:"flex", flexDirection:"column", background:T.bg, overflow:"hidden"}}>
      {/* Search bar */}
      <div style={{padding:"12px 16px", background:T.white, borderBottom:`1px solid ${T.border}`, flexShrink:0}}>
        <div style={{display:"flex", gap:8}}>
          <div style={{flex:1, display:"flex", alignItems:"center", gap:8,
            background:"#F0F4F3", borderRadius:12, padding:"10px 14px",
            border:`1px solid ${T.border}`}}>
            <Ico d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" sz={18} col={T.dim}/>
            <input value={query}
              onChange={e => { setQuery(e.target.value); if (!e.target.value) setView("home"); }}
              onKeyDown={e => { if(e.key==="Enter"){ setView("search"); search(); } }}
              placeholder="Search course name…"
              style={{flex:1, background:"none", border:"none", fontSize:14,
                color:T.text, outline:"none"}}/>
            {query && (
              <button onClick={() => { setQuery(""); setView("home"); }}
                style={{background:"none", border:"none", color:T.dim,
                  cursor:"pointer", fontSize:18, lineHeight:1, padding:0}}>×</button>
            )}
          </div>
          <button onClick={() => { setView("search"); search(); }}
            style={{background:T.teal, color:"#fff", border:"none", borderRadius:12,
              padding:"10px 16px", fontWeight:700, fontSize:14, cursor:"pointer",
              minWidth:72, display:"flex", alignItems:"center", justifyContent:"center"}}>
            {loading
              ? <div style={{width:16, height:16, border:"2px solid rgba(255,255,255,0.3)",
                  borderTopColor:"#fff", borderRadius:"50%", animation:"spin 0.7s linear infinite"}}/>
              : "Search"}
          </button>
        </div>
      </div>

      <div style={{flex:1, overflowY:"auto", padding:"14px 16px 80px"}}>
        {/* Section header */}
        <div style={{fontSize:11, fontWeight:700, color:T.sub, letterSpacing:0.8, marginBottom:12}}>
          {view === "search"
            ? `${results.length} COURSES FOUND`
            : locLoad ? "📍 FINDING NEARBY COURSES…" : "⛳ COURSES NEAR YOU"}
        </div>

        {err && (
          <div style={{padding:"8px 12px", background:"#FFF8E1",
            border:`1px solid ${T.gold}44`, borderRadius:8, fontSize:12,
            color:"#6D4C00", marginBottom:12}}>{err}</div>
        )}

        {locLoad && (
          <div style={{textAlign:"center", padding:32}}>
            <div style={{width:28, height:28, border:`3px solid ${T.border}`,
              borderTopColor:T.teal, borderRadius:"50%",
              animation:"spin 0.8s linear infinite", margin:"0 auto 12px"}}/>
            <div style={{fontSize:13, color:T.sub}}>Finding courses near you…</div>
          </div>
        )}

        {!locLoad && list.map((c, i) => (
          <CourseCard key={c.id || i} c={c} onPick={pick}/>
        ))}

        <div style={{fontSize:11, color:T.dim, textAlign:"center", paddingTop:4}}>
          30,000+ courses · powered by GolfCourseAPI
        </div>
      </div>
      <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
    </div>
  );
}
